name: Build Native Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-binaries:
    name: Build Cross-Platform Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Create output directory
        run: mkdir -p dist/binaries

      - name: Build macOS (Apple Silicon arm64)
        run: bun build --compile --target=bun-darwin-arm64 src/index.ts --outfile dist/binaries/swizzy-macos-arm64

      - name: Build macOS (Intel x64)
        run: bun build --compile --target=bun-darwin-x64 src/index.ts --outfile dist/binaries/swizzy-macos-x64

      - name: Build Linux (x64)
        run: bun build --compile --target=bun-linux-x64 src/index.ts --outfile dist/binaries/swizzy-linux-x64

      - name: Build Linux (ARM64)
        run: bun build --compile --target=bun-linux-arm64 src/index.ts --outfile dist/binaries/swizzy-linux-arm64

      - name: Build Windows (x64)
        run: bun build --compile --target=bun-windows-x64 src/index.ts --outfile dist/binaries/swizzy-windows-x64.exe

      - name: Compress binaries into archives
        run: |
          cd dist/binaries
          tar -czvf swizzy-macos-arm64.tar.gz swizzy-macos-arm64
          tar -czvf swizzy-macos-x64.tar.gz swizzy-macos-x64
          tar -czvf swizzy-linux-x64.tar.gz swizzy-linux-x64
          tar -czvf swizzy-linux-arm64.tar.gz swizzy-linux-arm64
          zip swizzy-windows-x64.zip swizzy-windows-x64.exe
          cd ../..

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swizzy-native-binaries
          path: dist/binaries/*

      - name: Attach binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
